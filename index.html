        <div class="intro-content">
            <div class="intro-text">
                <p>蟳埔簪花，是福建泉州蟳埔村世代传承的特色民俗，当地人把鲜花扎成花围盘在发髻之上，被大家称作“头上花海”。它源自古老的海洋渔俗化是渔家女性代代延续的装扮风俗。2008年，蟳埔女习俗列入国家级非物质文化遗产代表性项目。簪花不只是装饰，承载着渔村的美好祈愿，如今也成为泉州极具辨识度的文化符号。</p>
            </div>
